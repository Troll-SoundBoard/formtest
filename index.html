<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Forms Deep Extractor (Proxy Mode)</title>
    <style>
        :root {
            --primary: #4285F4;
            --bg: #f9f9f9;
            --card-bg: #ffffff;
            --text: #333;
            --border: #ddd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.2);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #3367d6;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #result-area {
            margin-top: 30px;
            display: none;
        }

        .result-item {
            border-bottom: 1px solid var(--border);
            padding: 15px 0;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .question {
            font-weight: 600;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 4px;
        }

        .answer {
            font-size: 1.1rem;
            color: var(--text);
            word-break: break-word;
        }

        .error {
            color: #d93025;
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }
        
        .info {
            font-size: 0.85rem;
            color: #777;
            margin-top: 15px;
            line-height: 1.4;
        }

        .loader {
            display: none;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Forms Deep Extractor (Proxy)</h1>
    <p class="info">
        Uses a CORS proxy to bypass browser restrictions. Paste your Google Forms submission link.
    </p>
    
    <div class="input-group">
        <label for="formUrl">Google Forms Link</label>
        <input type="text" id="formUrl" placeholder="https://docs.google.com/forms/...">
    </div>

    <button id="btn" onclick="extractAnswers()">Extract Answers</button>
    <div id="loader" class="loader">Fetching form data via proxy...</div>
    <div id="error-msg" class="error"></div>

    <div id="result-area">
        <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Extracted Data:</h2>
        <div id="results-list"></div>
    </div>
</div>

<script>
    // CORS Proxy URL
    const PROXY_URL = 'https://api.allorigins.win/raw?url=';

    async function extractAnswers() {
        const urlInput = document.getElementById('formUrl').value.trim();
        const resultArea = document.getElementById('result-area');
        const resultsList = document.getElementById('results-list');
        const errorMsg = document.getElementById('error-msg');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('btn');

        // Reset UI
        resultsList.innerHTML = '';
        errorMsg.style.display = 'none';
        resultArea.style.display = 'none';
        loader.style.display = 'block';
        btn.disabled = true;

        if (!urlInput) {
            showError("Please enter a URL.");
            return;
        }

        try {
            // Fetch the HTML content via CORS Proxy
            const proxyUrl = PROXY_URL + encodeURIComponent(urlInput);
            const response = await fetch(proxyUrl);
            
            if (!response.ok) {
                throw new Error(`Proxy Error: ${response.status}`);
            }

            const htmlText = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');

            let entries = [];

            // Method 1: Try to find the visual question/answer containers
            // Google Forms uses specific classes for the rendered question and answer
            const questionContainers = doc.querySelectorAll('.rKp9Cd, .fMBFMe, .x4I5T, .q'); 
            
            if (questionContainers.length > 0) {
                questionContainers.forEach(container => {
                    // Try to find the question text
                    const questionEl = container.querySelector('.qprop, .xpdn, .q, .D526rc');
                    // Try to find the answer text
                    const answerEl = container.querySelector('.n0UhZd, .oaj7Xc, .rKp9Cd, .vTlH4d');
                    
                    const questionText = questionEl?.innerText?.trim();
                    const answerText = answerEl?.innerText?.trim();

                    if (questionText || answerText) {
                        entries.push({
                            question: questionText || "Unknown Question",
                            answer: answerText || "No Answer Text"
                        });
                    }
                });
            }

            // Method 2: Fallback to hidden inputs if visual parsing fails
            if (entries.length === 0) {
                const hiddenInputs = doc.querySelectorAll('input[type="hidden"]');
                const formDataMap = new Map();

                hiddenInputs.forEach(input => {
                    if (input.name && input.value) {
                        formDataMap.set(input.name, input.value);
                    }
                });

                if (formDataMap.size > 0) {
                    // Try to find labels for the hidden inputs
                    const labels = doc.querySelectorAll('label');
                    const labelMap = new Map();
                    labels.forEach(label => {
                        const forAttr = label.getAttribute('for');
                        if (forAttr) {
                            labelMap.set(forAttr, label.innerText?.trim());
                        }
                    });

                    formDataMap.forEach((value, key) => {
                        const label = labelMap.get(key) || `Field ID: ${key}`;
                        entries.push({
                            question: label,
                            answer: value
                        });
                    });
                }
            }

            if (entries.length === 0) {
                throw new Error("Could not find any answers. The form might be empty or the structure changed.");
            }

            // Display results
            entries.forEach(entry => {
                const div = document.createElement('div');
                div.className = 'result-item';
                
                const questionLabel = document.createElement('div');
                questionLabel.className = 'question';
                questionLabel.textContent = entry.question;
                
                const answerText = document.createElement('div');
                answerText.className = 'answer';
                answerText.textContent = entry.answer;

                div.appendChild(questionLabel);
                div.appendChild(answerText);
                resultsList.appendChild(div);
            });

            resultArea.style.display = 'block';

        } catch (err) {
            showError("Error: " + err.message);
        } finally {
            loader.style.display = 'none';
            btn.disabled = false;
        }
    }

    function showError(msg) {
        const errorMsg = document.getElementById('error-msg');
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
        document.getElementById('loader').style.display = 'none';
        document.getElementById('btn').disabled = false;
    }
</script>

</body>
</html>
